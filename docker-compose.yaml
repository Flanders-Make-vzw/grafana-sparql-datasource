services:
  grafana:
    container_name: 'flandersmake-sparql-datasource'
    platform: "linux/amd64"
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-10.0.3}
    ports:
      - 3010:3000/tcp
    volumes:
      - "${HOST_WORKSPACE}/dist:/var/lib/grafana/plugins/flandersmake-sparql-datasource"
      - "${HOST_WORKSPACE}/provisioning:/etc/grafana/provisioning"
